[build-system]
requires = ["setuptools>=61,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-workflow"
# Single-sourced from src/hermes_workflow/version.py::PLUGIN_VERSION (see
# [tool.setuptools.dynamic] below) so the packaged version and the
# runtime/provenance version can never drift.
dynamic = ["version"]
description = "Declarative multi-stage workflow primitive over the Hermes Kanban board."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Carlos Raphael" }]
dependencies = ["PyYAML>=6,<7"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://github.com/carlosraphael/hermes-workflow"
Repository = "https://github.com/carlosraphael/hermes-workflow"

[project.entry-points."hermes_agent.plugins"]
hermes-workflow = "hermes_workflow"

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.15,<0.17"]

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# Catch real issues (errors, pyflakes, pyupgrade, bugbear). Import sorting (I)
# and the opinionated formatter are intentionally NOT enforced — they would
# reformat deliberate house style across the whole tree (surgical-changes rule).
select = ["E", "F", "B", "UP"]
ignore = ["E501"]   # no strict line-length enforcement (PEP 8, practical exceptions)

[tool.setuptools.dynamic]
# The single source of truth for the package version. setuptools reads the
# string literal from version.py (statically, no import needed) at build time.
version = { attr = "hermes_workflow.version.PLUGIN_VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hermes_workflow = ["plugin.yaml", "skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a real Hermes board + plugin load (no LLM)"]
