name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # Actions pinned by full commit SHA per the dependency-pinning policy
      # (see CONTRIBUTING.md). Comment records the human-readable version.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable + dev extras)
        run: python -m pip install -e '.[dev]'
      # Unit suite only: integration tests need a real Hermes board
      # (HERMES_AGENT_ROOT) and are deselected here. No LLM in any test.
      - name: Unit tests
        run: python -m pytest -m 'not integration'
