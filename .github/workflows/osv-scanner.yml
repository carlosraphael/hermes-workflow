name: osv-scanner

# Scan the resolved dependency closure for known vulnerabilities (OSV). Pinning
# bounds the upgrade window; OSV catches a known-bad version landing INSIDE the
# allowed range. The repo ships no committed lockfile (deliberate posture), and
# pyproject.toml is a manifest OSV-Scanner cannot extract as a lockfile, so we
# resolve the declared deps to a requirements file in CI and scan that with
# transitive resolution disabled (--no-resolve) — deterministic and network-light,
# since `pip freeze` already yields the full closure (and excludes pip/setuptools/
# wheel, keeping the scan to our declared dependencies). Actions SHA-pinned per
# CONTRIBUTING.md "Dependency pinning policy".
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - name: Resolve declared dependencies to a requirements lockfile
        run: |
          python -m pip install --upgrade pip
          python -m pip install '.[dev]'
          python -m pip freeze --exclude hermes-workflow > requirements.txt
      - uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: |-
            --no-resolve
            --lockfile=requirements.txt
